server {
    listen 80 default_server;
    server_name services services.wqe7002.lab;
    add_header X-WQE7002-Lab "controlled-service" always;
    location / { return 200 "WQE7002 controlled HTTP service\n"; }
}

server {
    listen 8080;
    server_name services services.wqe7002.lab;
    add_header X-WQE7002-Lab "controlled-alt-http-service" always;
    location / { return 200 "WQE7002 controlled alternate HTTP service\n"; }
}

server {
    listen 443 ssl;
    server_name services services.wqe7002.lab;
    ssl_certificate /etc/nginx/certs/services.crt;
    ssl_certificate_key /etc/nginx/certs/services.key;
    add_header X-WQE7002-Lab "controlled-https-service" always;
    location / { return 200 "WQE7002 controlled HTTPS service\n"; }
}
